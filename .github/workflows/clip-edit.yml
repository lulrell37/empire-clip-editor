name: R.O.G.U.E. clip edit

# Empire OS files the issue with the `rogue-clip` label already attached, so a
# single `labeled` event fires per job — trigger on that alone. (Also firing on
# `opened` was the bug: an issue born with a label fires BOTH events, so every
# job started two runs that then raced and confused each other.) `reopened` is
# the retry handle: reopen a stuck or failed issue to run it again.
on:
  issues:
    types: [labeled, reopened]

# One run per issue; a second event won't stomp a run in progress.
concurrency:
  group: clip-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write   # cut the clip-<n> release
  issues: write     # comment the markers back

jobs:
  edit:
    # Act only when it's the clip-queue label going on (or a reopen of a job
    # that carries it) — not any other label change on any other issue.
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'rogue-clip') ||
      (github.event.action == 'reopened' && contains(join(github.event.issue.labels.*.name, ','), 'rogue-clip'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Edit clip
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python -m agent.run
